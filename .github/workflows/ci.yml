name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate and verify
        run: |
          npm run generate
          npm run verify
          git diff --exit-code
      - name: Package Cursor extension
        run: npm run package:cursor
      - name: Validate plists and JSON
        run: |
          python3 - <<'PY'
          import json, pathlib, plistlib
          for path in pathlib.Path('dist').rglob('*.json'):
              json.loads(path.read_text())
          for suffix in ('*.itermcolors', '*.terminal', '*.tmTheme', '*.xccolortheme'):
              for path in pathlib.Path('dist').rglob(suffix):
                  with path.open('rb') as stream:
                      plistlib.load(stream)
          PY
      - name: Validate portable shell fragments
        run: shellcheck -s sh dist/fzf/one-dark-two.sh dist/shell/truecolor.sh
      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gitleaks"
          mkdir -p "$work"
          cd "$work"
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep "  $archive$" gitleaks_8.30.1_checksums.txt | sha256sum --check
          tar -xzf "$archive" gitleaks
          ./gitleaks dir --no-banner --redact "$GITHUB_WORKSPACE"
